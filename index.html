<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bengkel Modul Ajar TEFA — SMKN 12 Surabaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#2b3a55;
  --indigo-deep:#1c2740;
  --kraft:#efe6d3;
  --kraft-dark:#e2d5b8;
  --paper:#faf6ee;
  --terracotta:#c15f3c;
  --ochre:#c99a3d;
  --ink:#211d16;
  --ink-soft:#5a5346;
  --line:#d8c9a3;
  --ok:#4c7a5a;
  --radius:6px;
  --shadow: 0 1px 0 rgba(33,29,22,.05), 0 8px 20px -12px rgba(33,29,22,.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--kraft);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(33,29,22,.05) 1px, transparent 0);
  background-size: 22px 22px;
  color:var(--ink);
  font-family:'Work Sans', sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces', serif;}
.mono{font-family:'JetBrains Mono', monospace;}

/* ===== HEADER ===== */
.topbar{
  background:var(--indigo);
  color:var(--paper);
  padding:22px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  border-bottom:4px solid var(--terracotta);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{
  width:46px;height:46px;border-radius:50%;
  background:var(--paper);
  object-fit:contain;
  border:2px solid var(--ochre);
  flex-shrink:0;
  padding:3px;
}
.brand-text h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px;line-height:1.2;}
.brand-text p{margin:2px 0 0;font-size:12.5px;color:#c9d0dd;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;}
.topbar-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  border:1px solid rgba(255,255,255,.3);
  padding:6px 12px;
  border-radius:20px;
  color:#e9dfc7;
  white-space:nowrap;
}

/* ===== LAYOUT ===== */
.app{
  max-width:1180px;
  margin:0 auto;
  padding:28px 20px 80px;
  display:grid;
  grid-template-columns:250px 1fr;
  gap:26px;
  align-items:start;
}
@media (max-width:880px){
  .app{grid-template-columns:1fr;}
}

/* ===== STEPPER (kartu produksi) ===== */
.docket{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px 16px;
  position:sticky;
  top:20px;
}
.docket-title{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 14px;
  padding-bottom:10px;
  border-bottom:1px dashed var(--line);
}
.step-item{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px 8px;
  border-radius:5px;
  cursor:pointer;
  margin-bottom:2px;
  transition:background .15s;
}
.step-item:hover{background:var(--kraft-dark);}
.step-item.active{background:var(--indigo);}
.step-item.active .step-label,.step-item.active .step-sub{color:var(--paper);}
.step-num{
  width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;
  flex-shrink:0;
}
.step-item.active .step-num{border-color:var(--ochre);color:var(--ochre);}
.step-item.done .step-num{background:var(--ok);border-color:var(--ok);color:#fff;}
.step-label{font-size:13.5px;font-weight:600;display:block;}
.step-sub{font-size:11px;color:var(--ink-soft);}

/* ===== MAIN PANEL ===== */
.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  min-height:520px;
  display:flex;
  flex-direction:column;
}
.panel-head{
  padding:22px 30px 16px;
  border-bottom:1px dashed var(--line);
}
.panel-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--terracotta); margin:0 0 6px;
}
.panel-head h2{margin:0;font-size:24px;font-weight:600;color:var(--indigo-deep);}
.panel-head p{margin:8px 0 0;color:var(--ink-soft);font-size:14px;max-width:640px;line-height:1.5;}
.panel-body{padding:24px 30px 30px;flex:1;}
.panel-foot{
  padding:16px 30px;
  border-top:1px dashed var(--line);
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;
}

/* form elements */
.field{margin-bottom:18px;}
.field label{
  display:block;font-size:12.5px;font-weight:600;color:var(--ink);
  margin-bottom:6px;letter-spacing:.2px;
}
.field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
input[type=text],input[type=number],select,textarea{
  width:100%;
  font-family:'Work Sans',sans-serif;
  font-size:14px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  resize:vertical;
}
textarea{min-height:70px;line-height:1.5;}
input:focus,select:focus,textarea:focus{
  outline:2px solid var(--ochre);outline-offset:1px;border-color:var(--ochre);
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}}

/* jurusan grid */
.jurusan-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:10px;
  margin-top:6px;
}
.jurusan-card{
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:5px;
  padding:12px 12px;
  cursor:pointer;
  transition:all .15s;
}
.jurusan-card:hover{border-color:var(--ochre);}
.jurusan-card.selected{
  border-color:var(--indigo);
  background:var(--indigo);
}
.jurusan-card.selected .j-name{color:var(--paper);}
.jurusan-card.selected .j-tag{color:#c9d0dd;}
.j-name{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;display:block;}
.j-tag{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}

/* checkbox pills */
.pill-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.pill{
  border:1.5px solid var(--line);
  border-radius:20px;
  padding:7px 14px;
  font-size:12.5px;
  cursor:pointer;
  background:#fff;
  user-select:none;
}
.pill.active{background:var(--terracotta);border-color:var(--terracotta);color:#fff;}

/* dynamic list */
.list-editor .list-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;}
.list-editor .list-row textarea{flex:1;min-height:44px;}
.list-editor .rm-btn{
  background:none;border:1px solid var(--line);border-radius:4px;
  width:34px;height:34px;flex-shrink:0;cursor:pointer;color:var(--terracotta);font-size:16px;line-height:1;
}
.add-btn{
  border:1px dashed var(--ink-soft);
  background:none;border-radius:4px;
  padding:8px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);
  font-family:'JetBrains Mono',monospace;
}
.add-btn:hover{border-color:var(--indigo);color:var(--indigo);}

/* buttons */
.btn{
  font-family:'Work Sans',sans-serif;
  font-weight:600;font-size:13.5px;
  padding:11px 20px;
  border-radius:4px;border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{background:var(--indigo);color:var(--paper);}
.btn-primary:hover{background:var(--indigo-deep);}
.btn-ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
.btn-generate{background:var(--terracotta);color:#fff;font-size:15px;padding:14px 26px;}
.btn-generate:hover{background:#a54e30;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* tahapan cards */
.stage{
  border:1px solid var(--line);
  border-left:4px solid var(--ochre);
  border-radius:4px;
  padding:16px 18px;
  margin-bottom:14px;
  background:#fff;
}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.stage-head h4{margin:0;font-family:'Fraunces',serif;font-size:16px;color:var(--indigo-deep);}
.stage-head span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}

/* rubrik table */
.rubrik-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
.rubrik-table th,.rubrik-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
.rubrik-table th{background:var(--kraft-dark);font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}

/* progress dots on footer */
.progress-track{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--indigo-deep);color:var(--paper);
  padding:14px 22px;border-radius:6px;font-size:13.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  display:flex;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;}

.note-box{
  background:var(--kraft-dark);
  border:1px dashed var(--ink-soft);
  border-radius:5px;
  padding:12px 14px;
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:10px;
  line-height:1.5;
}
.section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:var(--indigo);
  margin:26px 0 10px;
  padding-top:16px;
  border-top:1px dashed var(--line);
}
.section-label:first-child{margin-top:0;border-top:none;padding-top:0;}
</style>
</head>

/* ================= HELPERS ================= */
function getJurusan(){ return JURUSAN.find(j=>j.id===state.jurusanId); }
function toast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function fillFromJurusan(){
  const j = getJurusan();
  if(!j) return;
  state.cp = j.cp;
  state.kompetensiAwal = j.kompetensiAwal;
  state.sarana = j.sarana;
  state.produk = j.produk;
  state.mitra = j.mitra;
  state.tujuan = [...j.tujuan];
  state.pemahaman = j.pemahaman;
  state.pemantik = [...j.pemantik];
  state.tahapan = STAGE_TEMPLATE.map(s=>({
    judul:s.judul, waktu:s.waktu,
    guru:s.guru,
    siswa:s.siswa.replace("{produk}", j.produk).replace("{mitra}", j.mitra)
  }));
  state.tahapan[3+1] && (state.tahapan[4].guru = state.tahapan[4].guru); // no-op guard
  state.tahapan.forEach(s=>{ s.guru = s.guru.replace("{mitra}", j.mitra).replace("{produk}", j.produk); });
}

/* ================= RENDER: STEPPER ================= */
function renderStepper(){
  const wrap = document.getElementById('stepper');
  wrap.innerHTML = STEPS.map((s,i)=>{
    const cls = i===state.step ? 'active' : (i<state.step ? 'done' : '');
    return `<div class="step-item ${cls}" data-step="${i}">
      <div class="step-num">${i<state.step ? '✓' : (i+1)}</div>
      <div><span class="step-label">${s.label}</span><span class="step-sub">${s.sub}</span></div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.step-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const target = parseInt(el.dataset.step);
      if(target <= state.step || state.jurusanId){ state.step = target; render(); }
    });
  });
}

function pppPills(){
  const labels = {keimanan:"Keimanan & Ketakwaan", kewargaan:"Kewargaan", penalaran:"Penalaran Kritis", kreativitas:"Kreativitas", kolaborasi:"Kolaborasi", kemandirian:"Kemandirian", kesehatan:"Kesehatan", komunikasi:"Komunikasi"};
  return Object.keys(labels).map(k=>`<div class="pill ${state.ppp[k]?'active':''}" data-k="${k}">${labels[k]}</div>`).join('');
}
function bindPppPills(){
  document.querySelectorAll('#ppp-group .pill').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.k;
      state.ppp[k] = !state.ppp[k];
      el.classList.toggle('active');
    });
  });
}

function renderJurusanGrid(){
  const grid = document.getElementById('jurusan-grid');
  const produktif = JURUSAN.filter(j=>j.kategori!=="umum");
  const umum = JURUSAN.filter(j=>j.kategori==="umum");
  const card = j => `
    <div class="jurusan-card ${state.jurusanId===j.id?'selected':''}" data-id="${j.id}">
      <span class="j-name">${j.nama}</span>
      <span class="j-tag">${j.tag}</span>
    </div>`;
  grid.innerHTML = `
    <p class="mono" style="grid-column:1/-1;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--indigo);margin:2px 0 2px;">Kompetensi Keahlian (Produktif)</p>
    ${produktif.map(card).join('')}
    <p class="mono" style="grid-column:1/-1;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--indigo);margin:14px 0 2px;padding-top:12px;border-top:1px dashed var(--line);">Mata Pelajaran Umum (Terintegrasi TEFA)</p>
    ${umum.map(card).join('')}
  `;
  grid.querySelectorAll('.jurusan-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const isNew = state.jurusanId !== el.dataset.id;
      state.jurusanId = el.dataset.id;
      if(isNew){ fillFromJurusan(); toast('Formulir terisi otomatis sesuai jurusan'); }
      render();
    });
  });
}

function renderDynamicList(containerId, stateKey){
  const el = document.getElementById(containerId);
  el.innerHTML = state[stateKey].map((v,i)=>`
    <div class="list-row">
      <textarea data-i="${i}" data-key="${stateKey}">${esc(v)}</textarea>
      <button class="rm-btn" data-i="${i}" data-key="${stateKey}" title="Hapus">×</button>
    </div>
  `).join('');
  el.querySelectorAll('textarea').forEach(t=>{
    t.addEventListener('input', e=>{ state[stateKey][t.dataset.i] = e.target.value; });
  });
  el.querySelectorAll('.rm-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      state[stateKey].splice(parseInt(b.dataset.i),1);
      render();
    });
  });
}

function bindText(id, key){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', e=>{ state[key] = e.target.value; });
}
function bindSelect(id, key){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('change', e=>{ state[key] = e.target.value; });
}
function esc(str){
  return (str||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ================= NAV ================= */
document.getElementById('btn-next').addEventListener('click', ()=>{
  if(state.step===0 && !state.jurusanId){ toast('Pilih kompetensi keahlian terlebih dahulu'); return; }
  if(state.step < STEPS.length-1){ state.step++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
document.getElementById('btn-prev').addEventListener('click', ()=>{
  if(state.step>0){ state.step--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
